name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only test + lint runs. GITHUB_TOKEN gets no
# write to anything. The scheduled crawl that DOES need contents:write
# (to commit aggregates back) lives in quarterly-crawl.yml with its own
# scoped permissions block.
permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run lint
      - name: Test (aggregate logic, no network)
        run: npm test
