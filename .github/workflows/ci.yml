name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read-only test + lint runs. GITHUB_TOKEN gets no
# write to anything. The scheduled crawl that DOES need contents:write
# (to commit aggregates back) lives in quarterly-crawl.yml with its own
# scoped permissions block.
permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run lint
      - name: Test (aggregate logic, no network)
        run: npm test
